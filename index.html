<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Convite Especial - Aylla Vitória</title>

<meta property="og:type" content="website" />
<meta property="og:title" content="Convite Especial - Aylla Vitória" />
<meta property="og:description" content="Você é nosso convidado especial! Toque para abrir." />
<meta property="og:image" content="capa.png" />

<!-- Pré-carregamento da foto de presentes do PostImages -->
<link rel="preload" as="image" href="https://i.postimg.cc/zX3NpXj6/presentes.png">

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%;
  background: #0d0608;
  overflow: hidden;
  font-family: system-ui, -apple-system, sans-serif;
  display: flex; align-items: center; justify-content: center;
}

.stage {
  position: relative;
  width: 100%; height: 100%;
  max-width: 480px; max-height: 100vh;
  aspect-ratio: 9 / 16;
  background: #000;
  overflow: hidden;
  box-shadow: 0 0 35px rgba(0,0,0,0.85);
}

.stage img, .stage video {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  user-select: none;
  -webkit-user-drag: none;
}

/* 1. Capa Envelope */
#cover {
  z-index: 50;
  cursor: pointer;
  transition: opacity 0.5s ease;
}
.opened #cover {
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.5s ease;
}

/* 2. Vídeos com Transição Suave (Crossfade) */
.video-player {
  z-index: 40;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.7s ease-in-out;
}
.video-player.visivel {
  opacity: 1;
  pointer-events: auto;
}

/* Botão Pular Vídeo */
#btn-pular {
  position: absolute;
  right: 14px;
  bottom: 24px;
  z-index: 45;
  display: none;
  background: rgba(0, 0, 0, 0.75);
  color: #fff;
  border: 1px solid rgba(212, 175, 55, 0.8);
  border-radius: 20px;
  padding: 8px 16px;
  font-size: 13px;
  font-weight: bold;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

/* 3. Página Principal (Convite) */
#convite-page {
  z-index: 10;
  display: none;
  opacity: 0;
  transition: opacity 0.6s ease;
}
#convite-page.show {
  display: block;
  opacity: 1;
}

/* 4. Página de Presentes */
#presentes-page {
  z-index: 25;
  display: none;
  opacity: 0;
  transition: opacity 0.4s ease;
}
#presentes-page.show {
  display: block;
  opacity: 1;
}

/* Indicador de toque na capa */
.tap-hint {
  position: absolute;
  top: 59%; left: 50%;
  transform: translate(-50%, -50%);
  z-index: 60;
  color: #fff;
  background: rgba(138, 30, 50, 0.92);
  border: 1px solid #d4af37;
  padding: 11px 24px;
  border-radius: 25px;
  font-size: 13px; font-weight: bold;
  letter-spacing: 1px;
  text-transform: uppercase;
  pointer-events: none;
  animation: pulse 1.8s infinite;
  box-shadow: 0 4px 18px rgba(0,0,0,0.5);
  transition: opacity 0.3s ease;
}
.opened .tap-hint { display: none !important; }

@keyframes pulse {
  0%, 100% { transform: translate(-50%, -50%) scale(1); }
  50% { transform: translate(-50%, -50%) scale(1.06); }
}

/* Camadas de botões invisíveis */
.btn-layer {
  position: absolute; inset: 0;
  z-index: 35;
  display: none;
}
.btn-layer.show { display: block; }

.btn-click {
  position: absolute;
  display: block;
  background: transparent;
  -webkit-tap-highlight-color: transparent;
  cursor: pointer;
}

/* Botões da Página Principal */
#btn-local { left: 9%; top: 73.5%; width: 25%; height: 15%; border-radius: 50%; }
#btn-presente { left: 37.5%; top: 73.5%; width: 25%; height: 15%; border-radius: 50%; }
#btn-presenca { left: 65.5%; top: 73.5%; width: 25%; height: 15%; border-radius: 50%; }

/* Botões da Página de Presentes */
/* Linha 1 */
#btn-pedagogicos { left: 19%; top: 46%; width: 19%; height: 16%; border-radius: 50%; }
#btn-livros       { left: 40.5%; top: 46%; width: 19%; height: 16%; border-radius: 50%; }
#btn-roupas       { left: 62%; top: 46%; width: 19%; height: 16%; border-radius: 50%; }

/* Linha 2 */
#btn-higiene     { left: 19%; top: 63%; width: 19%; height: 16%; border-radius: 50%; }
#btn-educativos  { left: 40.5%; top: 63%; width: 19%; height: 16%; border-radius: 50%; }
#btn-valepix     { left: 62%; top: 63%; width: 19%; height: 16%; border-radius: 50%; }

/* Botão Voltar */
#btn-voltar {
  left: 33%;
  top: 83.5%;
  width: 34%;
  height: 7%;
  border-radius: 25px;
}

/* Efeito de brilho ao clicar */
.btn-click:active::after {
  content: '';
  position: absolute;
  inset: -10%;
  border-radius: inherit;
  background: radial-gradient(circle, rgba(255, 223, 100, 0.8) 0%, rgba(212, 175, 55, 0.4) 50%, rgba(255, 255, 255, 0) 70%);
  animation: flashClick 0.5s ease-out;
}

@keyframes flashClick {
  0% { transform: scale(0.6); opacity: 1; }
  100% { transform: scale(1.4); opacity: 0; }
}

/* Canvas de faíscas */
#sparkle-canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 48;
  pointer-events: none;
}

/* Modal Elegante do Pix */
#modal-pix {
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.8);
  backdrop-filter: blur(4px);
  z-index: 100;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal-box {
  background: #fff8f0;
  border: 2px solid #d4af37;
  border-radius: 20px;
  padding: 24px 20px;
  text-align: center;
  width: 90%;
  max-width: 340px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.6);
  animation: popIn 0.3s ease-out;
}
@keyframes popIn {
  from { transform: scale(0.85); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
.modal-box h3 {
  color: #8a1e32;
  font-size: 19px;
  margin-bottom: 8px;
}
.modal-box p {
  color: #555;
  font-size: 13px;
  line-height: 1.4;
  margin-bottom: 16px;
}
.pix-chave-container {
  background: #f0e6d6;
  padding: 10px;
  border-radius: 10px;
  font-family: monospace;
  font-size: 13px;
  color: #333;
  word-break: break-all;
  user-select: all;
  margin-bottom: 16px;
  border: 1px dashed #c09d3b;
}
.btn-copiar {
  background: #8a1e32;
  color: #fff;
  border: none;
  padding: 12px 22px;
  border-radius: 25px;
  font-weight: bold;
  font-size: 14px;
  cursor: pointer;
  display: block;
  width: 100%;
  margin-bottom: 10px;
  box-shadow: 0 4px 12px rgba(138, 30, 50, 0.35);
}
.btn-fechar {
  background: transparent;
  color: #777;
  border: none;
  font-size: 13px;
  cursor: pointer;
  text-decoration: underline;
}
</style>
</head>
<body>

<div class="stage" id="stage">
  <!-- 1. Capa Envelope -->
  <img id="cover" src="./capa.png" alt="Capa Envelope" onclick="iniciarExperiencia()">
  <div class="tap-hint" onclick="iniciarExperiencia()">Toque para abrir</div>

  <!-- VÍDEOS COM TRANSIÇÃO EM CROSSFADE -->
  <video id="video-abertura" class="video-player" playsinline webkit-playsinline x5-playsinline preload="auto" src="https://i.imgur.com/JPzoItH.mp4"></video>
  <video id="video-fala" class="video-player" playsinline webkit-playsinline x5-playsinline preload="auto" src="https://i.imgur.com/3W1InHI.mp4"></video>

  <button id="btn-pular" type="button" onclick="irParaFinal()">Pular vídeo ✕</button>

  <canvas id="sparkle-canvas"></canvas>

  <!-- 3. Convite Principal -->
  <img id="convite-page" src="./pagina.png" alt="Convite Principal">

  <!-- Botões da Página Principal -->
  <div class="btn-layer" id="btnLayerPrincipal">
    <a id="btn-local" class="btn-click" 
       href="https://www.google.com/maps/search/?api=1&query=Espa%C3%A7o+Lion+Eventos" 
       target="_blank" rel="noopener noreferrer" onclick="animarBrilho(event)"></a>

    <a id="btn-presente" class="btn-click" href="javascript:void(0)" 
       onclick="animarBrilho(event); abrirPaginaPresentes()"></a>

    <!-- Substitua 55SEUNUMERODOTELEFONE pelo seu número com DDD (Ex: 5511999999999) -->
    <a id="btn-presenca" class="btn-click" 
       href="https://wa.me/55SEUNUMERODOTELEFONE?text=Ol%C3%A1!%20%F0%9F%92%95%20Com%20muita%20alegria%20confirmo%20minha%20presen%C3%A7a%20no%20anivers%C3%A1rio%20de%201%20aninho%20da%20princesa%20Aylla%20Vit%C3%B3ria!%20%F0%9F%91%91%E2%9C%A8%20Mal%20podemos%20esperar%20por%20esse%20dia%20especial!" 
       target="_blank" rel="noopener noreferrer" onclick="animarBrilho(event)"></a>
  </div>

  <!-- 4. Página de Presentes (PostImages) -->
  <img id="presentes-page" src="https://i.postimg.cc/zX3NpXj6/presentes.png" alt="Página de Presentes">

  <!-- Botões Interativos da Página de Presentes -->
  <div class="btn-layer" id="btnLayerPresentes">
    <!-- 1. Brinquedos Pedagógicos (Amazon) -->
    <a id="btn-pedagogicos" class="btn-click" 
       href="https://www.amazon.com.br/s?k=brinquedos+pedagogicos+1+ano" 
       target="_blank" rel="noopener noreferrer" onclick="animarBrilho(event)"></a>

    <!-- 2. Livros Infantis (Amazon Infantil) -->
    <a id="btn-livros" class="btn-click" 
       href="https://www.amazon.com.br/s?k=livros+infantis+bebe+1+ano" 
       target="_blank" rel="noopener noreferrer" onclick="animarBrilho(event)"></a>

    <!-- 3. Roupinhas (Lojas Renner Bebê) -->
    <a id="btn-roupas" class="btn-click" 
       href="https://www.lojasrenner.com.br/c/infantil/bebe" 
       target="_blank" rel="noopener noreferrer" onclick="animarBrilho(event)"></a>

    <!-- 4. Kit de Higiene Pessoal (Granado Bebê Oficial) -->
    <a id="btn-higiene" class="btn-click" 
       href="https://www.granado.com.br/bebe" 
       target="_blank" rel="noopener noreferrer" onclick="animarBrilho(event)"></a>

    <!-- 5. Brinquedos Educativos (Ri Happy) -->
    <a id="btn-educativos" class="btn-click" 
       href="https://www.rihappy.com.br/brinquedos-para-bebes" 
       target="_blank" rel="noopener noreferrer" onclick="animarBrilho(event)"></a>

    <!-- 6. Vale Presente (Abre popup do Pix) -->
    <a id="btn-valepix" class="btn-click" href="javascript:void(0)" 
       onclick="animarBrilho(event); abrirModalPix()"></a>

    <!-- Voltar ao Convite Principal -->
    <a id="btn-voltar" class="btn-click" href="javascript:void(0)" 
       onclick="animarBrilho(event); voltarAoConvite()"></a>
  </div>

  <!-- Modal Pix Pop-up -->
  <div id="modal-pix" onclick="fecharModalPix(event)">
    <div class="modal-box" onclick="event.stopPropagation()">
      <h3>🎁 Vale Presente (Pix)</h3>
      <p>Caso prefira nos agraciar com um mimo via Pix para o cofrinho da nossa princesinha:</p>
      
      <!-- Chave Pix (Coloque a sua chave aqui) -->
      <div class="pix-chave-container" id="texto-chave-pix">SUACHAVEPIXAQUI</div>
      
      <button class="btn-copiar" type="button" onclick="copiarChavePix()">Copiar Chave Pix ✨</button>
      <button class="btn-fechar" type="button" onclick="fecharModalPix()">Fechar</button>
    </div>
  </div>

</div>

<!-- Música de Fundo -->
<audio id="musica" src="https://i.imgur.com/Qv9rKqF.mp4" loop preload="auto"></audio>

<script>
// --- CONFIGURE AQUI SUA CHAVE PIX ---
const CHAVE_PIX = "SUACHAVEPIXAQUI"; // Coloque aqui seu CPF, Celular, E-mail ou Chave Aleatória

const stage = document.getElementById('stage');
const videoAbertura = document.getElementById('video-abertura');
const videoFala = document.getElementById('video-fala');
const btnPular = document.getElementById('btn-pular');
const convitePage = document.getElementById('convite-page');
const presentesPage = document.getElementById('presentes-page');
const btnLayerPrincipal = document.getElementById('btnLayerPrincipal');
const btnLayerPresentes = document.getElementById('btnLayerPresentes');
const musica = document.getElementById('musica');
const modalPix = document.getElementById('modal-pix');

// Atualiza o texto do pop-up com a chave
document.getElementById('texto-chave-pix').innerText = CHAVE_PIX;

// Canvas de brilhos
const canvas = document.getElementById('sparkle-canvas');
const ctx = canvas.getContext('2d');
let particles = [];
let animId = null;

function ajustarCanvas() {
  canvas.width = stage.clientWidth;
  canvas.height = stage.clientHeight;
}
window.addEventListener('resize', ajustarCanvas);

function animarBrilho(e) {
  ajustarCanvas();
  const rect = stage.getBoundingClientRect();
  const x = (e.clientX || (e.touches && e.touches[0].clientX) || (rect.left + rect.width / 2)) - rect.left;
  const y = (e.clientY || (e.touches && e.touches[0].clientY) || (rect.top + rect.height * 0.8)) - rect.top;

  const total = 35;
  const cores = ['#ffd700', '#fff8dc', '#ffb6c1', '#ffffff', '#e8a5b8'];

  for (let i = 0; i < total; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 5 + 1.5;
    particles.push({
      x: x, y: y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      radius: Math.random() * 3.5 + 1.5,
      alpha: 1,
      decay: Math.random() * 0.03 + 0.015,
      color: cores[Math.floor(Math.random() * cores.length)]
    });
  }

  if (!animId) animarParticulas();
}

function animarParticulas() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  let vivas = false;

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.alpha -= p.decay;

    if (p.alpha > 0) {
      vivas = true;
      ctx.save();
      ctx.globalAlpha = p.alpha;
      ctx.fillStyle = p.color;
      ctx.shadowBlur = 8;
      ctx.shadowColor = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    } else {
      particles.splice(i, 1);
    }
  }

  if (vivas) {
    animId = requestAnimationFrame(animarParticulas);
  } else {
    animId = null;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
}

let jaIniciou = false;
let transicaoIniciada = false;

// 1. Toca no envelope -> Inicia Vídeo 1
function iniciarExperiencia() {
  if (jaIniciou) return;
  jaIniciou = true;

  stage.classList.add('opened');
  videoAbertura.classList.add('visivel');
  btnPular.style.display = 'block';

  videoAbertura.currentTime = 0;
  videoAbertura.play().catch(() => {
    videoAbertura.muted = true;
    videoAbertura.play().catch(transicaoParaFala);
  });

  // Dispara a transição suave 0.6s antes do vídeo 1 acabar
  videoAbertura.addEventListener('timeupdate', () => {
    if (!transicaoIniciada && videoAbertura.duration && (videoAbertura.duration - videoAbertura.currentTime <= 0.65)) {
      transicaoIniciada = true;
      transicaoParaFala();
    }
  });

  videoAbertura.onended = () => {
    if (!transicaoIniciada) transicaoParaFala();
  };
  videoAbertura.onerror = transicaoParaFala;
}

// 2. Transição suave (Crossfade) para o Vídeo 2 (Maitê falando)
function transicaoParaFala() {
  transicaoIniciada = true;

  // Inicia vídeo 2
  videoFala.currentTime = 0;
  videoFala.muted = false;
  videoFala.classList.add('visivel'); // Faz o fade in suave

  if (musica) {
    musica.volume = 0.35;
    musica.play().catch(() => {});
  }

  videoFala.play().catch(() => {
    videoFala.muted = true;
    videoFala.play().catch(irParaFinal);
  });

  // Faz o fade out suave do vídeo 1 e depois desliga
  setTimeout(() => {
    videoAbertura.classList.remove('visivel');
    setTimeout(() => {
      videoAbertura.pause();
    }, 600);
  }, 300);

  videoFala.onended = irParaFinal;
  videoFala.onerror = irParaFinal;
}

// 3. Fim de tudo -> Exibe Convite Principal
function irParaFinal() {
  if (videoAbertura) {
    videoAbertura.classList.remove('visivel');
    videoAbertura.pause();
  }
  if (videoFala) {
    videoFala.classList.remove('visivel');
    videoFala.pause();
  }
  btnPular.style.display = 'none';
  stage.classList.add('opened');

  if (musica) {
    musica.volume = 0.65;
    if (musica.paused) {
      musica.play().catch(() => {});
    }
  }

  convitePage.classList.add('show');
  btnLayerPrincipal.classList.add('show');
}

// Navegação entre páginas
function abrirPaginaPresentes() {
  convitePage.classList.remove('show');
  btnLayerPrincipal.classList.remove('show');

  presentesPage.classList.add('show');
  btnLayerPresentes.classList.add('show');
}

function voltarAoConvite() {
  presentesPage.classList.remove('show');
  btnLayerPresentes.classList.remove('show');

  convitePage.classList.add('show');
  btnLayerPrincipal.classList.add('show');
}

// Funções do Modal Pix
function abrirModalPix() {
  modalPix.style.display = 'flex';
}

function fecharModalPix(e) {
  modalPix.style.display = 'none';
}

function copiarChavePix() {
  if (CHAVE_PIX === "SUACHAVEPIXAQUI") {
    alert("✨ Por favor, substitua 'SUACHAVEPIXAQUI' no início do script pelo seu Pix real!");
    return;
  }
  navigator.clipboard.writeText(CHAVE_PIX).then(() => {
    alert("✨ Chave Pix copiada com sucesso!");
    fecharModalPix();
  }).catch(() => {
    prompt("Copie a chave Pix abaixo:", CHAVE_PIX);
  });
}
</script>

</body>
</html>
