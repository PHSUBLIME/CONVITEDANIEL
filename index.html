<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%;
  background: #0d0608;
  overflow: hidden;
  font-family: system-ui, -apple-system, sans-serif;
  display: flex; align-items: center; justify-content: center;
}

.stage {
  position: relative;
  width: 100%; height: 100%;
  max-width: 480px; max-height: 100vh;
  aspect-ratio: 9 / 16;
  background: #000;
  overflow: hidden;
  box-shadow: 0 0 35px rgba(0,0,0,0.85);
}

.stage img, .stage video {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  user-select: none;
  -webkit-user-drag: none;
}

/* 1. Capa Envelope */
#cover {
  z-index: 50;
  cursor: pointer;
  transition: opacity 0.5s ease;
}
.opened #cover {
  opacity: 0;
  pointer-events: none;
}

/* 2. Vídeos com Transição */
.video-player {
  z-index: 40;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.7s ease-in-out;
}
.video-player.visivel {
  opacity: 1;
  pointer-events: auto;
}

#btn-pular {
  position: absolute;
  right: 14px;
  bottom: 24px;
  z-index: 48;
  display: none;
  background: rgba(0, 0, 0, 0.75);
  color: #fff;
  border: 1px solid rgba(212, 175, 55, 0.8);
  border-radius: 20px;
  padding: 8px 16px;
  font-size: 13px;
  font-weight: bold;
  cursor: pointer;
}

/* 🌟 SLIDESHOW DE RETROSPECTIVA DA MAITÊ 🌟 */
#slideshow-container {
  position: absolute;
  inset: 0;
  z-index: 42;
  background: radial-gradient(circle at center, #220813 0%, #0c0205 100%);
  display: none;
  opacity: 0;
  transition: opacity 1s ease;
  overflow: hidden;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
#slideshow-container.visivel {
  display: flex;
  opacity: 1;
}
.slideshow-title {
  font-family: 'Great Vibes', cursive;
  color: #f7d58b;
  font-size: clamp(28px, 7vw, 36px);
  text-shadow: 0 0 12px rgba(212, 175, 55, 0.65);
  margin-bottom: 14px;
  z-index: 3;
  text-align: center;
  padding: 0 15px;
}
.photo-frame {
  position: relative;
  width: 82%;
  height: 64%;
  border-radius: 24px;
  border: 3px solid #d4af37;
  box-shadow: 0 0 30px rgba(212, 175, 55, 0.45), 0 15px 35px rgba(0, 0, 0, 0.9);
  overflow: hidden;
  background: #140308;
}

.slide-photo {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0;
  transform: scale(1.02);
  transition: opacity 1.3s cubic-bezier(0.4, 0, 0.2, 1), transform 4.6s cubic-bezier(0.25, 1, 0.5, 1);
}
.slide-photo.ativo {
  opacity: 1;
  transform: scale(1.12);
}

.photo-smoke-pulse {
  position: absolute;
  inset: -15%;
  background: radial-gradient(circle, rgba(255, 248, 230, 0.88) 0%, rgba(255, 195, 215, 0.65) 45%, transparent 75%);
  filter: blur(22px);
  opacity: 0;
  pointer-events: none;
  z-index: 5;
  transition: opacity 0.65s ease-in-out;
}
.photo-smoke-pulse.ativo {
  opacity: 1;
}

.slide-dots {
  display: flex;
  gap: 8px;
  margin-top: 14px;
  z-index: 3;
}
.dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.25);
  border: 1px solid #d4af37;
  transition: all 0.5s ease;
}
.dot.ativo {
  background: #ffd700;
  transform: scale(1.4);
  box-shadow: 0 0 8px #ffd700;
}

/* 3. Página Principal */
#convite-page {
  z-index: 10;
  display: none;
  opacity: 0;
  transition: opacity 0.8s ease;
}
#convite-page.show {
  display: block;
  opacity: 1;
}

#smoke-overlay {
  position: absolute;
  inset: -10%;
  z-index: 44;
  pointer-events: none;
  opacity: 0;
  background: radial-gradient(circle, rgba(255, 248, 220, 0.95) 0%, rgba(255, 192, 203, 0.75) 45%, rgba(138, 30, 50, 0.4) 75%, transparent 100%);
  filter: blur(25px);
  transform: scale(0.7);
  transition: opacity 0.6s ease, transform 0.9s cubic-bezier(0.2, 0.8, 0.2, 1);
}
#smoke-overlay.animar {
  opacity: 1;
  transform: scale(1.3);
}

/* 🦋 Borboleta 3D */
#butterfly {
  position: absolute;
  top: 0; left: 0;
  width: 52px;
  height: 52px;
  z-index: 75;
  pointer-events: none;
  transform-origin: center center;
  filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.9));
  display: block;
  will-change: transform;
}
.butterfly-body {
  width: 100%; height: 100%;
  position: relative;
  perspective: 600px;
}
.butterfly-torso {
  position: absolute;
  top: 25%; left: 47%;
  width: 6%; height: 45%;
  background: #5c0f1e;
  border-radius: 10px;
  z-index: 3;
}
.wing {
  position: absolute;
  top: 15%;
  width: 48%;
  height: 68%;
  background: radial-gradient(circle at 75% 25%, #fff9e6 0%, #ff9ebb 50%, #8a1329 100%);
  border: 1.5px solid #ffe066;
  transform-origin: right center;
  animation: flapLeft 0.26s infinite alternate ease-in-out;
}
.wing.left {
  left: 0;
  border-radius: 80% 30% 70% 20%;
}
.wing.right {
  left: 52%;
  border-radius: 30% 80% 20% 70%;
  transform-origin: left center;
  animation: flapRight 0.26s infinite alternate ease-in-out;
}
@keyframes flapLeft {
  0% { transform: rotateY(0deg); }
  100% { transform: rotateY(70deg); }
}
@keyframes flapRight {
  0% { transform: rotateY(0deg); }
  100% { transform: rotateY(-70deg); }
}

/* 4. Página de Presentes */
#presentes-page {
  z-index: 25;
  display: none;
  opacity: 0;
  transition: opacity 0.4s ease;
}
#presentes-page.show {

}

.tap-hint {
  position: absolute;
  top: 59%; left: 50%;
  transform: translate(-50%, -50%);
  z-index: 60;
  color: #fff;

  text-transform: uppercase;
  pointer-events: none;
  animation: pulse 1.8s infinite;
}
.opened .tap-hint { display: none !important; }

@keyframes pulse {
  0%, 100% { transform: translate(-50%, -50%) scale(1); }
  50% { transform: translate(-50%, -50%) scale(1.06); }
}

.btn-layer {

}
.btn-layer.show { display: block; }

.btn-click {

/* Botões Principais */
#btn-local { left: 9%; top: 73.5%; width: 25%; height: 15%; border-radius: 50%; }

/* Modal Pix */
#modal-pix {

}

  color: #777;
  border: none;
  cursor: pointer;
  text-decoration: underline;
}
</style>

<script>
const CHAVE_PIX = "SUACHAVEPIXAQUI";

const stage = document.getElementById('stage');
const videoAbertura = document.getElementById('video-abertura');
const videoFala = document.getElementById('video-fala');
const btnPular = document.getElementById('btn-pular');
const convitePage = document.getElementById('convite-page');
const presentesPage = document.getElementById('presentes-page');
const btnLayerPrincipal = document.getElementById('btnLayerPrincipal');
const btnLayerPresentes = document.getElementById('btnLayerPresentes');
const musica = document.getElementById('musica');
const audioNarracao = document.getElementById('audio-narracao');
const modalPix = document.getElementById('modal-pix');
const smokeOverlay = document.getElementById('smoke-overlay');
const butterfly = document.getElementById('butterfly');

// Elementos do Slideshow
const slideshowContainer = document.getElementById('slideshow-container');
const slidePhotos = document.querySelectorAll('.slide-photo');
const slideDots = document.querySelectorAll('.dot');
const photoSmoke = document.getElementById('photoSmoke');
let slideAtual = 0;
let slideInterval = null;

document.getElementById('texto-chave-pix').innerText = CHAVE_PIX;

const canvas = document.getElementById('sparkle-canvas');
const ctx = canvas.getContext('2d');
let particles = [];
let butterflySparkles = [];

function ajustarCanvas() {
  canvas.width = stage.clientWidth;
  canvas.height = stage.clientHeight;
}
window.addEventListener('resize', ajustarCanvas);
ajustarCanvas();

// ==========================================
// 🦋 ANIMAÇÃO DA BORBOLETA E PÓ DE FADA
// ==========================================
let borboletaAtiva = true;
let bX = 160, bY = 240;
let prevX = 160, prevY = 240;
let tempoVoo = 0;

function ativarBorboleta(sim) {
  borboletaAtiva = sim;
  butterfly.style.display = sim ? 'block' : 'none';
}

function atualizarBorboleta() {
  if (!borboletaAtiva) return;

  tempoVoo += 0.025;
  const w = stage.clientWidth || 360;
  const h = stage.clientHeight || 640;

  prevX = bX;
  prevY = bY;

  bX = (w * 0.5) + Math.sin(tempoVoo * 0.9) * (w * 0.35) + Math.cos(tempoVoo * 1.8) * 25;
  bY = (h * 0.38) + Math.cos(tempoVoo * 0.7) * (h * 0.22) + Math.sin(tempoVoo * 1.5) * 35;

  const dx = bX - prevX;
  const dy = bY - prevY;
  const angulo = Math.atan2(dy, dx) * (180 / Math.PI) + 90;

  butterfly.style.transform = `translate(${bX - 26}px, ${bY - 26}px) rotate(${angulo}deg)`;

  if (Math.random() < 0.7) {
    const cores = ['#ffe29f', '#ffffff', '#ffd700', '#ffb6c1'];
    butterflySparkles.push({
      x: bX + (Math.random() * 8 - 4),
      y: bY + (Math.random() * 8 - 4),
      vx: (Math.random() - 0.5) * 1.2,
      vy: Math.random() * 1.5 + 0.4,
      radius: Math.random() * 3 + 1.2,
      alpha: 1,
      decay: Math.random() * 0.02 + 0.015,
      color: cores[Math.floor(Math.random() * cores.length)]
    });
  }
}

function loopAnimacao() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  atualizarBorboleta();

  for (let i = butterflySparkles.length - 1; i >= 0; i--) {
    const p = butterflySparkles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.alpha -= p.decay;

    if (p.alpha > 0) {
      ctx.save();
      ctx.globalAlpha = p.alpha;
      ctx.fillStyle = p.color;
      ctx.shadowBlur = 6;
      ctx.shadowColor = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    } else {
      butterflySparkles.splice(i, 1);
    }
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.alpha -= p.decay;

    if (p.alpha > 0) {
      ctx.save();
      ctx.globalAlpha = p.alpha;
      ctx.fillStyle = p.color;
      ctx.shadowBlur = 8;
      ctx.shadowColor = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    } else {
      particles.splice(i, 1);
    }
  }

  requestAnimationFrame(loopAnimacao);
}
requestAnimationFrame(loopAnimacao);

function animarBrilho(e) {
  ajustarCanvas();
  const rect = stage.getBoundingClientRect();
  const x = (e.clientX || (e.touches && e.touches[0].clientX) || (rect.left + rect.width / 2)) - rect.left;
  const y = (e.clientY || (e.touches && e.touches[0].clientY) || (rect.top + rect.height * 0.8)) - rect.top;

  const total = 35;
  const cores = ['#ffd700', '#fff8dc', '#ffb6c1', '#ffffff', '#e8a5b8'];

  for (let i = 0; i < total; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 5 + 1.5;
    particles.push({
      x: x, y: y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      radius: Math.random() * 3.5 + 1.5,
      alpha: 1,
      decay: Math.random() * 0.03 + 0.015,
      color: cores[Math.floor(Math.random() * cores.length)]
    });
  }
}

let jaIniciou = false;
let transicaoIniciada = false;

// 1. Toque no Envelope -> DESTRAVA OS ÁUDIOS NO NAVEGADOR
function iniciarExperiencia() {
  if (jaIniciou) return;
  jaIniciou = true;

  // 🔓 DESTRAVA O ÁUDIO PARA O CELULAR PERMITIR TOCAR
  if (audioNarracao) {
    audioNarracao.volume = 0;
    const promessa = audioNarracao.play();
    if (promessa !== undefined) {
      promessa.then(() => {
        audioNarracao.pause();
        audioNarracao.currentTime = 0;
        audioNarracao.volume = 1;
      }).catch(() => {});
    }
  }

  if (musica) {
    musica.volume = 0;
    const promessaMusica = musica.play();
    if (promessaMusica !== undefined) {
      promessaMusica.then(() => {
        musica.pause();
        musica.currentTime = 0;
      }).catch(() => {});
    }
  }

  ativarBorboleta(false);

  stage.classList.add('opened');
  videoAbertura.classList.add('visivel');
  btnPular.style.display = 'block';

  videoAbertura.currentTime = 0;
  videoAbertura.play().catch(() => {
    videoAbertura.muted = true;
    videoAbertura.play().catch(iniciarSlideshow);
  });

  videoAbertura.addEventListener('timeupdate', () => {
    if (!transicaoIniciada && videoAbertura.duration && (videoAbertura.duration - videoAbertura.currentTime <= 0.65)) {
      transicaoIniciada = true;
      iniciarSlideshow();
    }
  });

  videoAbertura.onended = () => {
    if (!transicaoIniciada) iniciarSlideshow();
  };
  videoAbertura.onerror = iniciarSlideshow;
}

// 2. Inicia o Slideshow com Narração e Música em segundo plano
function iniciarSlideshow() {
  transicaoIniciada = true;

  videoAbertura.classList.remove('visivel');
  setTimeout(() => { videoAbertura.pause(); }, 500);

  // Inicia a música de fundo com volume bem baixinho para a voz ficar perfeita
  if (musica) {
    musica.volume = 0.18;
    musica.play().catch(() => {});
  }

  // Toca o áudio da Narração destravado
  if (audioNarracao) {
    audioNarracao.currentTime = 0;
    audioNarracao.volume = 1;
    audioNarracao.play().catch(err => {
      console.log("Tentando reproduzir narração:", err);
    });
    
    audioNarracao.onended = () => {
      if (musica) musica.volume = 0.5;
    };
  }

  slideshowContainer.classList.add('visivel');
  slideAtual = 0;
  mostrarSlide(slideAtual);

  slideInterval = setInterval(() => {
    photoSmoke.classList.add('ativo');

    setTimeout(() => {
      slideAtual++;
      if (slideAtual < slidePhotos.length) {
        mostrarSlide(slideAtual);
        setTimeout(() => {
          photoSmoke.classList.remove('ativo');
        }, 350);
      } else {
        clearInterval(slideInterval);
        photoSmoke.classList.remove('ativo');
        finalizarSlideshowEIrParaFala();
      }
    }, 550);

  }, 3800);
}

function mostrarSlide(index) {
  slidePhotos.forEach((img, i) => {
    img.classList.toggle('ativo', i === index);
  });
  slideDots.forEach((dot, i) => {
    dot.classList.toggle('ativo', i === index);
  });
}

function finalizarSlideshowEIrParaFala() {
  slideshowContainer.classList.remove('visivel');

  if (musica) {
    musica.volume = 0.28;
  }

  videoFala.currentTime = 0;
  videoFala.muted = false;
  videoFala.classList.add('visivel');

  videoFala.play().catch(() => {
    videoFala.muted = true;
    videoFala.play().catch(irParaFinal);
  });

  videoFala.onended = irParaFinal;
  videoFala.onerror = irParaFinal;
}

function irParaFinal() {
  if (slideInterval) clearInterval(slideInterval);
  if (audioNarracao) audioNarracao.pause();
  btnPular.style.display = 'none';

  smokeOverlay.classList.add('animar');

  setTimeout(() => {
    if (videoAbertura) {
      videoAbertura.classList.remove('visivel');
      videoAbertura.pause();
    }
    if (slideshowContainer) {
      slideshowContainer.classList.remove('visivel');
    }
    if (videoFala) {
      videoFala.classList.remove('visivel');
      videoFala.pause();
    }

    stage.classList.add('opened');

    if (musica) {
      musica.volume = 0.65;
      if (musica.paused) musica.play().catch(() => {});
    }

    convitePage.classList.add('show');
    btnLayerPrincipal.classList.add('show');

    setTimeout(() => {
      smokeOverlay.classList.remove('animar');
    }, 450);

  }, 350);
}

function abrirPaginaPresentes() {
  convitePage.classList.remove('show');
  btnLayerPrincipal.classList.remove('show');

  presentesPage.classList.add('show');
  btnLayerPresentes.classList.add('show');

  ativarBorboleta(true);
}

function voltarAoConvite() {
  presentesPage.classList.remove('show');
  btnLayerPresentes.classList.remove('show');

  ativarBorboleta(false);

  convitePage.classList.add('show');
  btnLayerPrincipal.classList.add('show');
}

function abrirModalPix() {
  modalPix.style.display = 'flex';
}

function fecharModalPix(e) {
  modalPix.style.display = 'none';
}

function copiarChavePix() {
  if (CHAVE_PIX === "SUACHAVEPIXAQUI") {
    alert("✨ Por favor, substitua 'SUACHAVEPIXAQUI' no início do script pelo seu Pix real!");
    return;
  }
  navigator.clipboard.writeText(CHAVE_PIX).then(() => {
    alert("✨ Chave Pix copiada com sucesso!");
    fecharModalPix();
  }).catch(() => {
    prompt("Copie a chave Pix abaixo:", CHAVE_PIX);
  });
}
