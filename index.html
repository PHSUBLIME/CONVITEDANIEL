<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Convite Especial - Aylla Vitória</title>

<meta property="og:type" content="website" />
<meta property="og:title" content="Convite Especial - Aylla Vitória" />
<meta property="og:description" content="Você é nosso convidado especial! Toque para abrir." />
<meta property="og:image" content="capa.png" />

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%;
  background: #0d0608;
  overflow: hidden;
  font-family: system-ui, -apple-system, sans-serif;
  display: flex; align-items: center; justify-content: center;
}

.stage {
  position: relative;
  width: 100%; height: 100%;
  max-width: 480px; max-height: 100vh;
  aspect-ratio: 9 / 16;
  background: #000;
  overflow: hidden;
  box-shadow: 0 0 35px rgba(0,0,0,0.85);
}

.stage img, .stage video {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  user-select: none;
  -webkit-user-drag: none;
}

/* 1. Capa Envelope */
#cover {
  z-index: 50;
  cursor: pointer;
  transition: opacity 0.4s ease;
}
.opened #cover {
  display: none !important;
}

/* 2. Vídeos de Transição */
.video-player {
  z-index: 40;
  display: none;
  background: #000;
}
.video-player.ativo {
  display: block;
}

/* Botão Pular Vídeo */
#btn-pular {
  position: absolute;
  right: 14px;
  bottom: 24px;
  z-index: 45;
  display: none;
  background: rgba(0, 0, 0, 0.75);
  color: #fff;
  border: 1px solid rgba(212, 175, 55, 0.8);
  border-radius: 20px;
  padding: 8px 16px;
  font-size: 13px;
  font-weight: bold;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

/* 3. Página Principal (Convite) */
#convite-page {
  z-index: 10;
  display: none;
}
#convite-page.show {
  display: block;
}

/* 4. Página de Presentes */
#presentes-page {
  z-index: 25;
  display: none;
}
#presentes-page.show {
  display: block;
}

/* Indicador de toque na capa */
.tap-hint {
  position: absolute;
  top: 59%; left: 50%;
  transform: translate(-50%, -50%);
  z-index: 60;
  color: #fff;
  background: rgba(138, 30, 50, 0.92);
  border: 1px solid #d4af37;
  padding: 11px 24px;
  border-radius: 25px;
  font-size: 13px; font-weight: bold;
  letter-spacing: 1px;
  text-transform: uppercase;
  pointer-events: none;
  animation: pulse 1.8s infinite;
  box-shadow: 0 4px 18px rgba(0,0,0,0.5);
}
.opened .tap-hint { display: none !important; }

@keyframes pulse {
  0%, 100% { transform: translate(-50%, -50%) scale(1); }
  50% { transform: translate(-50%, -50%) scale(1.06); }
}

/* Camadas de botões invisíveis */
.btn-layer {
  position: absolute; inset: 0;
  z-index: 35;
  display: none;
}
.btn-layer.show { display: block; }

.btn-click {
  position: absolute;
  display: block;
  background: transparent;
  -webkit-tap-highlight-color: transparent;
}

/* Botões da Página Principal */
#btn-local { left: 9%; top: 73.5%; width: 25%; height: 15%; border-radius: 50%; }
#btn-presente { left: 37.5%; top: 73.5%; width: 25%; height: 15%; border-radius: 50%; }
#btn-presenca { left: 65.5%; top: 73.5%; width: 25%; height: 15%; border-radius: 50%; }

/* Botão Voltar da Página de Presentes */
#btn-voltar {
  left: 32%;
  top: 83%;
  width: 36%;
  height: 9%;
  border-radius: 25px;
}

/* Efeito de brilho ao clicar */
.btn-click:active::after {
  content: '';
  position: absolute;
  inset: -10%;
  border-radius: inherit;
  background: radial-gradient(circle, rgba(255, 223, 100, 0.8) 0%, rgba(212, 175, 55, 0.4) 50%, rgba(255, 255, 255, 0) 70%);
  animation: flashClick 0.5s ease-out;
}

@keyframes flashClick {
  0% { transform: scale(0.6); opacity: 1; }
  100% { transform: scale(1.4); opacity: 0; }
}

/* Canvas de faíscas */
#sparkle-canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 48;
  pointer-events: none;
}
</style>
</head>
<body>

<div class="stage" id="stage">
  <!-- 1. Capa Envelope -->
  <img id="cover" src="./capa.png" alt="Capa Envelope" onclick="iniciarExperiencia()">
  <div class="tap-hint" onclick="iniciarExperiencia()">Toque para abrir</div>

  <!-- VÍDEOS -->
  <video id="video-abertura" class="video-player" playsinline webkit-playsinline x5-playsinline preload="auto" src="https://i.imgur.com/JPzoItH.mp4"></video>
  <video id="video-fala" class="video-player" playsinline webkit-playsinline x5-playsinline preload="auto" src="https://i.imgur.com/3W1InHI.mp4"></video>

  <button id="btn-pular" type="button" onclick="irParaFinal()">Pular vídeo ✕</button>

  <canvas id="sparkle-canvas"></canvas>

  <!-- 3. Convite Principal -->
  <img id="convite-page" src="./pagina.png" alt="Convite Principal">

  <!-- Botões da Página Principal -->
  <div class="btn-layer" id="btnLayerPrincipal">
    <a id="btn-local" class="btn-click" 
       href="https://www.google.com/maps/search/?api=1&query=Espa%C3%A7o+Lion+Eventos" 
       target="_blank" rel="noopener" onclick="animarBrilho(event)"></a>

    <a id="btn-presente" class="btn-click" href="javascript:void(0)" 
       onclick="animarBrilho(event); abrirPaginaPresentes()"></a>

    <a id="btn-presenca" class="btn-click" 
       href="https://wa.me/55SEUNUMEROAQUI?text=Ol%C3%A1!%20Gostaria%20de%20confirmar%20minha%20presen%C3%A7a%20no%20anivers%C3%A1rio%20de%201%20aninho%20da%20Aylla%20Vit%C3%B3ria!%20%F0%9F%91%91" 
       target="_blank" rel="noopener" onclick="animarBrilho(event)"></a>
  </div>

  <!-- 4. Página de Presentes (com cache buster) -->
  <img id="presentes-page" src="./presentes.png?v=2" alt="Página de Presentes">

  <!-- Botões da Página de Presentes -->
  <div class="btn-layer" id="btnLayerPresentes">
    <a id="btn-voltar" class="btn-click" href="javascript:void(0)" 
       onclick="animarBrilho(event); voltarAoConvite()"></a>
  </div>

</div>

<!-- Música de Fundo -->
<audio id="musica" src="https://i.imgur.com/Qv9rKqF.mp4" loop preload="auto"></audio>

<script>
const stage = document.getElementById('stage');
const videoAbertura = document.getElementById('video-abertura');
const videoFala = document.getElementById('video-fala');
const btnPular = document.getElementById('btn-pular');
const convitePage = document.getElementById('convite-page');
const presentesPage = document.getElementById('presentes-page');
const btnLayerPrincipal = document.getElementById('btnLayerPrincipal');
const btnLayerPresentes = document.getElementById('btnLayerPresentes');
const musica = document.getElementById('musica');

// Canvas de brilhos
const canvas = document.getElementById('sparkle-canvas');
const ctx = canvas.getContext('2d');
let particles = [];
let animId = null;

function ajustarCanvas() {
  canvas.width = stage.clientWidth;
  canvas.height = stage.clientHeight;
}
window.addEventListener('resize', ajustarCanvas);

function animarBrilho(e) {
  ajustarCanvas();
  const rect = stage.getBoundingClientRect();
  const x = (e.clientX || (e.touches && e.touches[0].clientX) || (rect.left + rect.width / 2)) - rect.left;
  const y = (e.clientY || (e.touches && e.touches[0].clientY) || (rect.top + rect.height * 0.8)) - rect.top;

  const total = 35;
  const cores = ['#ffd700', '#fff8dc', '#ffb6c1', '#ffffff', '#e8a5b8'];

  for (let i = 0; i < total; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 5 + 1.5;
    particles.push({
      x: x, y: y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      radius: Math.random() * 3.5 + 1.5,
      alpha: 1,
      decay: Math.random() * 0.03 + 0.015,
      color: cores[Math.floor(Math.random() * cores.length)]
    });
  }

  if (!animId) animarParticulas();
}

function animarParticulas() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  let vivas = false;

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.alpha -= p.decay;

    if (p.alpha > 0) {
      vivas = true;
      ctx.save();
      ctx.globalAlpha = p.alpha;
      ctx.fillStyle = p.color;
      ctx.shadowBlur = 8;
      ctx.shadowColor = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    } else {
      particles.splice(i, 1);
    }
  }

  if (vivas) {
    animId = requestAnimationFrame(animarParticulas);
  } else {
    animId = null;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
}

let jaIniciou = false;

function iniciarExperiencia() {
  if (jaIniciou) return;
  jaIniciou = true;

  stage.classList.add('opened');
  videoAbertura.classList.add('ativo');
  btnPular.style.display = 'block';

  videoAbertura.currentTime = 0;
  videoAbertura.play().catch(() => {
    videoAbertura.muted = true;
    videoAbertura.play().catch(tocarVideoFala);
  });

  videoAbertura.onended = tocarVideoFala;
  videoAbertura.onerror = tocarVideoFala;
}

function tocarVideoFala() {
  videoAbertura.pause();
  videoAbertura.classList.remove('ativo');
  videoAbertura.style.display = 'none';

  videoFala.classList.add('ativo');
  videoFala.currentTime = 0;
  videoFala.muted = false;

  if (musica) {
    musica.volume = 0.35;
    musica.play().catch(() => {});
  }

  const promessa = videoFala.play();
  if (promessa !== undefined) {
    promessa.catch(() => {
      videoFala.muted = true;
      videoFala.play().catch(irParaFinal);
    });
  }

  videoFala.onended = irParaFinal;
  videoFala.onerror = irParaFinal;
}

function irParaFinal() {
  if (videoAbertura) {
    videoAbertura.pause();
    videoAbertura.style.display = 'none';
  }
  if (videoFala) {
    videoFala.pause();
    videoFala.style.display = 'none';
  }
  btnPular.style.display = 'none';
  stage.classList.add('opened');

  if (musica) {
    musica.volume = 0.65;
    if (musica.paused) {
      musica.play().catch(() => {});
    }
  }

  convitePage.classList.add('show');
  btnLayerPrincipal.classList.add('show');
}

function abrirPaginaPresentes() {
  convitePage.classList.remove('show');
  btnLayerPrincipal.classList.remove('show');

  presentesPage.classList.add('show');
  btnLayerPresentes.classList.add('show');
}

function voltarAoConvite() {
  presentesPage.classList.remove('show');
  btnLayerPresentes.classList.remove('show');

  convitePage.classList.add('show');
  btnLayerPrincipal.classList.add('show');
}
</script>

</body>
</html>
