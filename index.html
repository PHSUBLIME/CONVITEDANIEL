* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {

}

.stage {

.stage img, .stage video {

}

#btn-pular {

/* 🌟 SLIDESHOW COM O CASTELO NO FUNDO 🌟 */

  align-items: center;

}
#slideshow-container.visivel {
  display: flex;
  opacity: 1;
}

.slideshow-bg {
  position: absolute;
  inset: -15px;
  background: url('./pagina.png') center/cover no-repeat;
  filter: blur(5px) brightness(0.55);
  transform: scale(1.06);
  z-index: 1;
}

.slideshow-title {
  font-family: 'Great Vibes', cursive;
  color: #f7d58b;

  z-index: 3;
  text-align: center;
  padding: 0 15px;
}

.photo-frame {

  overflow: hidden;
  background: #140308;
  z-index: 3;
}

.slide-photo {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;

  transform: scale(1.02);
  transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1), transform 5s cubic-bezier(0.25, 1, 0.5, 1);
}
.slide-photo.ativo {
  opacity: 1;
  transform: scale(1.12);
}

.photo-smoke-pulse {
  position: absolute;
  inset: -15%;
  background: radial-gradient(circle, rgba(255, 248, 230, 0.88) 0%, rgba(255, 195, 215, 0.65) 45%, transparent 75%);

  opacity: 0;
  pointer-events: none;
  z-index: 5;

}
.photo-smoke-pulse.ativo {
  opacity: 1;
}

.slide-dots {
  display: flex;
  gap: 7px;
  margin-top: 14px;
  z-index: 3;
}
.dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.35);
  border: 1px solid #d4af37;
  transition: all 0.5s ease;

  transform: scale(1.4);

}

/* 3. Página Principal */

  pointer-events: none;
  z-index: 75;

.magic-butterfly {
  position: absolute;
  top: 0; left: 0;
  pointer-events: none;
  transform-origin: center center;
  filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.9));
  display: block;
  will-change: transform;
}
.butterfly-body {
  width: 100%; height: 100%;
  position: relative;
  perspective: 600px;
}
.butterfly-torso {
  position: absolute;
  top: 25%; left: 47%;
  width: 6%; height: 45%;
  background: #5c0f1e;
  border-radius: 10px;
  z-index: 3;
}
.wing {
  position: absolute;
  top: 15%;
  width: 48%;
  height: 68%;
  border: 1.5px solid #ffe066;
  transform-origin: right center;
}
.wing.left {
  left: 0;
  border-radius: 80% 30% 70% 20%;
  animation: flapLeft 0.25s infinite alternate ease-in-out;
}
.wing.right {
  left: 52%;
  border-radius: 30% 80% 20% 70%;
  transform-origin: left center;
  animation: flapRight 0.25s infinite alternate ease-in-out;
}

#b1 .wing { background: radial-gradient(circle at 75% 25%, #fff9e6 0%, #ff9ebb 50%, #8a1329 100%); }
#b2 .wing { background: radial-gradient(circle at 75% 25%, #ffffff 0%, #ffe082 50%, #b37400 100%); }
#b3 .wing { background: radial-gradient(circle at 75% 25%, #fff5f8 0%, #f48fb1 50%, #6a0b22 100%); }

@keyframes flapLeft {
  0% { transform: rotateY(0deg); }
  100% { transform: rotateY(70deg); }
}
@keyframes flapRight {
  0% { transform: rotateY(0deg); }
  100% { transform: rotateY(-70deg); }
}

}
.opened .tap-hint { display: none !important; }

@keyframes pulse {
  0%, 100% { transform: translate(-50%, -50%) scale(1); }
  50% { transform: translate(-50%, -50%) scale(1.06); }
}

.btn-layer {

.btn-click {

  "https://raw.githubusercontent.com/PHSUBLIME/CONVITEDANIEL/main/narra%C3%A7%C3%A3o.mp3",
  "./narra%C3%A7%C3%A3o.mp3",
  "./narracao.mp3",
  "https://raw.githubusercontent.com/PHSUBLIME/CONVITEDANIEL/main/narracao.mp3",
  "https://files.catbox.moe/txl3r7.mp3"
];

let indiceFonte = 0;

function carregarAudioSeguro() {
  if (indiceFonte >= fontesAudio.length) return;
  audioNarracao.src = fontesAudio[indiceFonte];
  audioNarracao.load();
}
carregarAudioSeguro();

audioNarracao.addEventListener('error', () => {
  indiceFonte++;
  carregarAudioSeguro();
});

// ==========================================
// ✨ RASTRO MÁGICO AO PASSAR MOUSE OU DEDO
// ==========================================
function soltarBrilhoRastro(x, y) {
  const cores = ['#ffd700', '#fff8dc', '#ffb6c1', '#ffffff', '#ffe29f'];
  for (let i = 0; i < 3; i++) {
    particles.push({
      x: x + (Math.random() * 12 - 6),
      y: y + (Math.random() * 12 - 6),
      vx: (Math.random() - 0.5) * 2,
      vy: (Math.random() - 0.5) * 2 + 0.5,
      radius: Math.random() * 3 + 1,
      alpha: 1,
      decay: Math.random() * 0.025 + 0.015,
      color: cores[Math.floor(Math.random() * cores.length)]
    });
  }
}

stage.addEventListener('mousemove', (e) => {
  const rect = stage.getBoundingClientRect();
  soltarBrilhoRastro(e.clientX - rect.left, e.clientY - rect.top);
});

stage.addEventListener('touchmove', (e) => {
  if (e.touches && e.touches[0]) {
    const rect = stage.getBoundingClientRect();
    soltarBrilhoRastro(e.touches[0].clientX - rect.left, e.touches[0].clientY - rect.top);
  }
}, { passive: true });

// ==========================================
// 🦋 3 BORBOLETAS VOANDO SIMULTANEAMENTE
// ==========================================
let borboletasAtivas = true;
let tVoo = 0;

function ativarBorboletas(sim) {
  borboletasAtivas = sim;
  butterfliesGroup.style.display = sim ? 'block' : 'none';
}

function atualizarBorboletas() {
  if (!borboletasAtivas) return;

  tVoo += 0.022;
  const w = stage.clientWidth || 360;
  const h = stage.clientHeight || 640;

  const b1X = (w * 0.48) + Math.sin(tVoo * 0.85) * (w * 0.36) + Math.cos(tVoo * 1.6) * 20;
  const b1Y = (h * 0.35) + Math.cos(tVoo * 0.7) * (h * 0.18) + Math.sin(tVoo * 1.4) * 28;
  const dx1 = Math.cos(tVoo * 0.85);
  const dy1 = -Math.sin(tVoo * 0.7);
  const ang1 = Math.atan2(dy1, dx1) * (180 / Math.PI) + 90;
  b1.style.transform = `translate(${b1X - 25}px, ${b1Y - 25}px) rotate(${ang1}deg)`;

  const b2X = (w * 0.52) + Math.cos(tVoo * 0.95 + 1.2) * (w * 0.34);
  const b2Y = (h * 0.45) + Math.sin(tVoo * 0.8 + 1.2) * (h * 0.22);
  const ang2 = Math.atan2(Math.cos(tVoo * 0.8 + 1.2), -Math.sin(tVoo * 0.95 + 1.2)) * (180 / Math.PI) + 90;
  b2.style.transform = `translate(${b2X - 21}px, ${b2Y - 21}px) rotate(${ang2}deg)`;

  const b3X = (w * 0.5) + Math.sin(tVoo * 1.1 + 2.5) * (w * 0.28);
  const b3Y = (h * 0.28) + Math.cos(tVoo * 0.9 + 2.5) * (h * 0.15);
  const ang3 = Math.atan2(-Math.sin(tVoo * 0.9 + 2.5), Math.cos(tVoo * 1.1 + 2.5)) * (180 / Math.PI) + 90;
  b3.style.transform = `translate(${b3X - 18}px, ${b3Y - 18}px) rotate(${ang3}deg)`;

  if (Math.random() < 0.8) {
    const alvos = [ {x: b1X, y: b1Y}, {x: b2X, y: b2Y}, {x: b3X, y: b3Y} ];
    const p = alvos[Math.floor(Math.random() * alvos.length)];
    const cores = ['#ffe29f', '#ffffff', '#ffd700', '#ffb6c1'];

    butterflySparkles.push({
      x: p.x + (Math.random() * 8 - 4),
      y: p.y + (Math.random() * 8 - 4),
      vx: (Math.random() - 0.5) * 1.2,
      vy: Math.random() * 1.5 + 0.4,
      radius: Math.random() * 2.8 + 1.2,
      alpha: 1,
      decay: Math.random() * 0.02 + 0.015,
      color: cores[Math.floor(Math.random() * cores.length)]
    });
  }
}

function loopAnimacao() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  atualizarBorboletas();

  for (let i = butterflySparkles.length - 1; i >= 0; i--) {
    const p = butterflySparkles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.alpha -= p.decay;

    if (p.alpha > 0) {
      ctx.save();
      ctx.globalAlpha = p.alpha;
      ctx.fillStyle = p.color;
      ctx.shadowBlur = 6;
      ctx.shadowColor = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    } else {
      butterflySparkles.splice(i, 1);
    }
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.alpha -= p.decay;

    if (p.alpha > 0) {
      ctx.save();
      ctx.globalAlpha = p.alpha;
      ctx.fillStyle = p.color;
      ctx.shadowBlur = 8;
      ctx.shadowColor = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    } else {
      particles.splice(i, 1);
    }
  }

  requestAnimationFrame(loopAnimacao);
}
requestAnimationFrame(loopAnimacao);

function animarBrilho(e) {
  ajustarCanvas();
  const rect = stage.getBoundingClientRect();
  const x = (e.clientX || (e.touches && e.touches[0].clientX) || (rect.left + rect.width / 2)) - rect.left;
  const y = (e.clientY || (e.touches && e.touches[0].clientY) || (rect.top + rect.height * 0.8)) - rect.top;

  const total = 35;
  const cores = ['#ffd700', '#fff8dc', '#ffb6c1', '#ffffff', '#e8a5b8'];

  for (let i = 0; i < total; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 5 + 1.5;
    particles.push({
      x: x, y: y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      radius: Math.random() * 3.5 + 1.5,
      alpha: 1,
      decay: Math.random() * 0.03 + 0.015,
      color: cores[Math.floor(Math.random() * cores.length)]
    });
  }
}

let jaIniciou = false;
let transicaoIniciada = false;

// 1. Toque no Envelope -> Inicia Castelo
function iniciarExperiencia() {
  if (jaIniciou) return;
  jaIniciou = true;

  if (audioNarracao) {
    audioNarracao.play().then(() => {
      audioNarracao.pause();
      audioNarracao.currentTime = 0;
    }).catch(() => {});
  }

  if (musica) {
    musica.play().then(() => {
      musica.pause();
      musica.currentTime = 0;
    }).catch(() => {});
  }

  ativarBorboletas(false);

  stage.classList.add('opened');
  videoAbertura.classList.add('visivel');
  btnPular.style.display = 'block';

  videoAbertura.currentTime = 0;
  videoAbertura.play().catch(() => {
    videoAbertura.muted = true;
    videoAbertura.play().catch(iniciarSlideshow);
  });

  videoAbertura.addEventListener('timeupdate', () => {
    if (!transicaoIniciada && videoAbertura.duration && (videoAbertura.duration - videoAbertura.currentTime <= 0.65)) {
      transicaoIniciada = true;
      iniciarSlideshow();
    }
  });

  videoAbertura.onended = () => {
    if (!transicaoIniciada) iniciarSlideshow();
  };
  videoAbertura.onerror = iniciarSlideshow;
}

// 2. Inicia o Slideshow com o Castelo ao fundo
function iniciarSlideshow() {
  transicaoIniciada = true;

  videoAbertura.classList.remove('visivel');
  setTimeout(() => { videoAbertura.pause(); }, 500);

  if (musica) {
    musica.volume = 0.58;
    musica.play().catch(() => {});
  }

  if (audioNarracao) {
    audioNarracao.currentTime = 0;
    audioNarracao.volume = 1;
    audioNarracao.play().catch(err => {
      indiceFonte++;
      carregarAudioSeguro();
      audioNarracao.play().catch(() => {});
    });
  }

  slideshowContainer.classList.add('visivel');
  slideAtual = 0;
  mostrarSlide(slideAtual);

  ativarBorboletas(true);

  let duracaoNarracao = (audioNarracao && audioNarracao.duration && !isNaN(audioNarracao.duration)) 
                        ? audioNarracao.duration 
                        : 16;
  
  let tempoPorFoto = Math.max(2400, (duracaoNarracao / slidePhotos.length) * 1000);

  slideInterval = setInterval(() => {
    photoSmoke.classList.add('ativo');

    photoChangeTimeout = setTimeout(() => {
      slideAtual++;
      if (slideAtual < slidePhotos.length) {
        mostrarSlide(slideAtual);
        smokeTimeout = setTimeout(() => {
          photoSmoke.classList.remove('ativo');
        }, 350);
      } else {
        finalizarSlideshowEIrParaFala();
      }
    }, 550);

  }, tempoPorFoto);

  audioNarracao.onended = () => {
    finalizarSlideshowEIrParaFala();
  };
}

function mostrarSlide(index) {
  slidePhotos.forEach((img, i) => {
    img.classList.toggle('ativo', i === index);
  });
  slideDots.forEach((dot, i) => {
    dot.classList.toggle('ativo', i === index);
  });
}

// 3. Fim das Fotos -> Vídeo 2 da Maitê
function finalizarSlideshowEIrParaFala() {
  if (falaIniciada) return;
  falaIniciada = true;

  if (slideInterval) {
    clearInterval(slideInterval);
    slideInterval = null;
  }
  if (photoChangeTimeout) clearTimeout(photoChangeTimeout);
  if (smokeTimeout) clearTimeout(smokeTimeout);

  slideshowContainer.classList.remove('visivel');
  ativarBorboletas(false);

  if (musica) {
    musica.volume = 0.22;
  }

  videoFala.currentTime = 0;
  videoFala.muted = false;
  videoFala.classList.add('visivel');

  videoFala.play().catch(() => {
    videoFala.muted = true;
    videoFala.play().catch(irParaFinal);
  });

  videoFala.onended = irParaFinal;
  videoFala.onerror = irParaFinal;
}

// 4. Convite Final
function irParaFinal() {
  falaIniciada = true;
  if (slideInterval) clearInterval(slideInterval);
  if (photoChangeTimeout) clearTimeout(photoChangeTimeout);
  if (smokeTimeout) clearTimeout(smokeTimeout);
  if (audioNarracao) audioNarracao.pause();
  
  btnPular.style.display = 'none';
  smokeOverlay.classList.add('animar');

  setTimeout(() => {
    if (videoAbertura) {
      videoAbertura.classList.remove('visivel');
      videoAbertura.pause();
    }
    if (slideshowContainer) {
      slideshowContainer.classList.remove('visivel');
    }
    if (videoFala) {
      videoFala.classList.remove('visivel');
      videoFala.pause();
    }

    stage.classList.add('opened');

    if (musica) {
      musica.volume = 0.65;
      if (musica.paused) musica.play().catch(() => {});
    }

    convitePage.classList.add('show');
    btnLayerPrincipal.classList.add('show');

    ativarBorboletas(true);

    setTimeout(() => {
      smokeOverlay.classList.remove('animar');
    }, 450);

  }, 350);
}

function abrirPaginaPresentes() {
  convitePage.classList.remove('show');
  btnLayerPrincipal.classList.remove('show');

  presentesPage.classList.add('show');
  btnLayerPresentes.classList.add('show');

  ativarBorboletas(true);
}

function voltarAoConvite() {
  presentesPage.classList.remove('show');
  btnLayerPresentes.classList.remove('show');

  convitePage.classList.add('show');
  btnLayerPrincipal.classList.add('show');

  ativarBorboletas(true);
}
