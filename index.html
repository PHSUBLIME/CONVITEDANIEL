<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Convite Especial - Maitê</title>

<meta property="og:type" content="website" />
<meta property="og:title" content="Convite Especial - 1 Aninho da Maitê" />
<meta property="og:description" content="Você é nosso convidado especial! Toque para abrir." />
<meta property="og:image" content="capa.png" />

<link rel="preload" as="image" href="https://i.postimg.cc/zX3NpXj6/presentes.png">

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%;
  background: #0d0608;
  overflow: hidden;
  font-family: system-ui, -apple-system, sans-serif;
  display: flex; align-items: center; justify-content: center;
}

.stage {
  position: relative;
  width: 100%; height: 100%;
  max-width: 480px; max-height: 100vh;
  aspect-ratio: 9 / 16;
  background: #000;
  overflow: hidden;
  box-shadow: 0 0 35px rgba(0,0,0,0.85);
}

.stage img, .stage video {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  user-select: none;
  -webkit-user-drag: none;
}

/* 1. Capa Envelope */
#cover {
  z-index: 50;
  cursor: pointer;
  transition: opacity 0.5s ease;
}
.opened #cover {
  opacity: 0;
  pointer-events: none;
}

/* 2. Vídeos com Transição */
.video-player {
  z-index: 40;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.7s ease-in-out;
}
.video-player.visivel {
  opacity: 1;
  pointer-events: auto;
}

#btn-pular {
  position: absolute;
  right: 14px;
  bottom: 24px;
  z-index: 45;
  display: none;
  background: rgba(0, 0, 0, 0.75);
  color: #fff;
  border: 1px solid rgba(212, 175, 55, 0.8);
  border-radius: 20px;
  padding: 8px 16px;
  font-size: 13px;
  font-weight: bold;
  cursor: pointer;
}

/* 3. Página Principal */
#convite-page {
  z-index: 10;
  display: none;
  opacity: 0;
  transition: opacity 0.8s ease;
}
#convite-page.show {
  display: block;
  opacity: 1;
}

/* EFEITO FUMAÇA / NÉVOA MÁGICA */
#smoke-overlay {
  position: absolute;
  inset: -10%;
  z-index: 44;
  pointer-events: none;
  opacity: 0;
  background: radial-gradient(circle, rgba(255, 248, 220, 0.95) 0%, rgba(255, 192, 203, 0.75) 45%, rgba(138, 30, 50, 0.4) 75%, transparent 100%);
  filter: blur(25px);
  transform: scale(0.7);
  transition: opacity 0.6s ease, transform 0.9s cubic-bezier(0.2, 0.8, 0.2, 1);
}
#smoke-overlay.animar {
  opacity: 1;
  transform: scale(1.3);
}

/* 🦋 BORBOLETA 3D */
#butterfly {
  position: absolute;
  top: 0; left: 0;
  width: 48px;
  height: 48px;
  z-index: 55;
  pointer-events: none;
  transform-origin: center center;
  filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.85));
  display: none;
  will-change: transform;
}
.butterfly-body {
  width: 100%; height: 100%;
  position: relative;
  perspective: 600px;
}
.wing {
  position: absolute;
  top: 15%;
  width: 50%;
  height: 70%;
  background: radial-gradient(circle at 70% 30%, #fff7d6 0%, #ff9ebb 55%, #b31b38 100%);
  border: 1px solid #ffd700;
  border-radius: 80% 30% 70% 20%;
  transform-origin: right center;
  animation: flapLeft 0.28s infinite alternate ease-in-out;
}
.wing.right {
  left: 50%;
  border-radius: 30% 80% 20% 70%;
  transform-origin: left center;
  animation: flapRight 0.28s infinite alternate ease-in-out;
}
@keyframes flapLeft {
  0% { transform: rotateY(0deg); }
  100% { transform: rotateY(68deg); }
}
@keyframes flapRight {
  0% { transform: rotateY(0deg); }
  100% { transform: rotateY(-68deg); }
}

/* 4. Página de Presentes */
#presentes-page {
  z-index: 25;
  display: none;
  opacity: 0;
  transition: opacity 0.4s ease;
}
#presentes-page.show {
  display: block;
  opacity: 1;
}

.tap-hint {
  position: absolute;
  top: 59%; left: 50%;
  transform: translate(-50%, -50%);
  z-index: 60;
  color: #fff;
  background: rgba(138, 30, 50, 0.92);
  border: 1px solid #d4af37;
  padding: 11px 24px;
  border-radius: 25px;
  font-size: 13px; font-weight: bold;
  letter-spacing: 1px;
  text-transform: uppercase;
  pointer-events: none;
  animation: pulse 1.8s infinite;
}
.opened .tap-hint { display: none !important; }

@keyframes pulse {
  0%, 100% { transform: translate(-50%, -50%) scale(1); }
  50% { transform: translate(-50%, -50%) scale(1.06); }
}

.btn-layer {
  position: absolute; inset: 0;
  z-index: 35;
  display: none;
}
.btn-layer.show { display: block; }

.btn-click {
  position: absolute;
  display: block;
  background: transparent;
  cursor: pointer;
}

/* Botões da Página Principal */
#btn-local { left: 9%; top: 73.5%; width: 25%; height: 15%; border-radius: 50%; }
#btn-presente { left: 37.5%; top: 73.5%; width: 25%; height: 15%; border-radius: 50%; }
#btn-presenca { left: 65.5%; top: 73.5%; width: 25%; height: 15%; border-radius: 50%; }

/* Botões de Presentes */
#btn-pedagogicos { left: 19%; top: 46%; width: 19%; height: 16%; border-radius: 50%; }
#btn-livros       { left: 40.5%; top: 46%; width: 19%; height: 16%; border-radius: 50%; }
#btn-roupas       { left: 62%; top: 46%; width: 19%; height: 16%; border-radius: 50%; }

#btn-higiene     { left: 19%; top: 63%; width: 19%; height: 16%; border-radius: 50%; }
#btn-educativos  { left: 40.5%; top: 63%; width: 19%; height: 16%; border-radius: 50%; }
#btn-valepix     { left: 62%; top: 63%; width: 19%; height: 16%; border-radius: 50%; }

#btn-voltar {
  left: 33%;
  top: 83.5%;
  width: 34%;
  height: 7%;
  border-radius: 25px;
}

#sparkle-canvas {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  z-index: 54;
  pointer-events: none;
}

/* Modal Pix */
#modal-pix {
  position: absolute; inset: 0;
  background: rgba(0, 0, 0, 0.8);
  backdrop-filter: blur(4px);
  z-index: 100;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal-box {
  background: #fff8f0;
  border: 2px solid #d4af37;
  border-radius: 20px;
  padding: 24px 20px;
  text-align: center;
  width: 90%;
  max-width: 340px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.6);
}
.modal-box h3 { color: #8a1e32; font-size: 19px; margin-bottom: 8px; }
.modal-box p { color: #555; font-size: 13px; margin-bottom: 16px; }
.pix-chave-container {
  background: #f0e6d6;
  padding: 10px;
  border-radius: 10px;
  font-family: monospace;
  font-size: 13px;
  word-break: break-all;
  margin-bottom: 16px;
  border: 1px dashed #c09d3b;
}
.btn-copiar {
  background: #8a1e32;
  color: #fff;
  border: none;
  padding: 12px 22px;
  border-radius: 25px;
  font-weight: bold;
  cursor: pointer;
  width: 100%;
  margin-bottom: 10px;
}
.btn-fechar {
  background: transparent;
  color: #777;
  border: none;
  cursor: pointer;
  text-decoration: underline;
}
</style>
</head>
<body>

<div class="stage" id="stage">
  <!-- 1. Capa -->
  <img id="cover" src="./capa.png" alt="Capa" onclick="iniciarExperiencia()">
  <div class="tap-hint" onclick="iniciarExperiencia()">Toque para abrir</div>

  <!-- Borboleta Encantada -->
  <div id="butterfly">
    <div class="butterfly-body">
      <div class="wing left"></div>
      <div class="wing right"></div>
    </div>
  </div>

  <!-- Vídeos -->
  <video id="video-abertura" class="video-player" playsinline webkit-playsinline x5-playsinline preload="auto" src="https://i.imgur.com/JPzoItH.mp4"></video>
  <video id="video-fala" class="video-player" playsinline webkit-playsinline x5-playsinline preload="auto" src="https://i.imgur.com/3W1InHI.mp4"></video>

  <!-- Efeito Fumaça / Névoa Mágica -->
  <div id="smoke-overlay"></div>

  <button id="btn-pular" type="button" onclick="irParaFinal()">Pular vídeo ✕</button>

  <canvas id="sparkle-canvas"></canvas>

  <!-- 3. Convite Principal (Sua imagem editada) -->
  <img id="convite-page" src="./pagina.png" alt="Convite Principal">

  <!-- Botões Principais -->
  <div class="btn-layer" id="btnLayerPrincipal">
    <a id="btn-local" class="btn-click" 
       href="https://www.google.com/maps/search/?api=1&query=Espa%C3%A7o+Aquarela+Festas+e+Eventos" 
       target="_blank" rel="noopener noreferrer" onclick="animarBrilho(event)"></a>

    <a id="btn-presente" class="btn-click" href="javascript:void(0)" 
       onclick="animarBrilho(event); abrirPaginaPresentes()"></a>

    <a id="btn-presenca" class="btn-click" 
       href="https://wa.me/55SEUNUMERODOTELEFONE?text=Ol%C3%A1!%20%F0%9F%92%95%20Com%20muita%20alegria%20confirmo%20minha%20presen%C3%A7a%20no%20anivers%C3%A1rio%20de%201%20aninho%20da%20Mait%C3%AA!%20%F0%9F%91%91%E2%9C%A8%20Nos%20vemos%20dia%2014%2F11%20%C3%A0s%2016h%20no%20Espa%C3%A7o%20Aquarela!%20%F0%9F%8E%89" 
       target="_blank" rel="noopener noreferrer" onclick="animarBrilho(event)"></a>
  </div>

  <!-- 4. Presentes -->
  <img id="presentes-page" src="https://i.postimg.cc/zX3NpXj6/presentes.png" alt="Presentes">

  <div class="btn-layer" id="btnLayerPresentes">
    <a id="btn-pedagogicos" class="btn-click" href="https://www.amazon.com.br/s?k=brinquedos+pedagogicos+1+ano" target="_blank" rel="noopener noreferrer" onclick="animarBrilho(event)"></a>
    <a id="btn-livros" class="btn-click" href="https://www.amazon.com.br/s?k=livros+infantis+bebe+1+ano" target="_blank" rel="noopener noreferrer" onclick="animarBrilho(event)"></a>
    <a id="btn-roupas" class="btn-click" href="https://www.lojasrenner.com.br/c/infantil/bebe" target="_blank" rel="noopener noreferrer" onclick="animarBrilho(event)"></a>
    <a id="btn-higiene" class="btn-click" href="https://www.granado.com.br/bebe" target="_blank" rel="noopener noreferrer" onclick="animarBrilho(event)"></a>
    <a id="btn-educativos" class="btn-click" href="https://www.rihappy.com.br/brinquedos-para-bebes" target="_blank" rel="noopener noreferrer" onclick="animarBrilho(event)"></a>
    <a id="btn-valepix" class="btn-click" href="javascript:void(0)" onclick="animarBrilho(event); abrirModalPix()"></a>
    <a id="btn-voltar" class="btn-click" href="javascript:void(0)" onclick="animarBrilho(event); voltarAoConvite()"></a>
  </div>

  <!-- Modal Pix -->
  <div id="modal-pix" onclick="fecharModalPix(event)">
    <div class="modal-box" onclick="event.stopPropagation()">
      <h3>🎁 Vale Presente da Maitê</h3>
      <p>Caso prefira nos agraciar com um mimo via Pix para o cofrinho da princesinha Maitê:</p>
      <div class="pix-chave-container" id="texto-chave-pix">SUACHAVEPIXAQUI</div>
      <button class="btn-copiar" type="button" onclick="copiarChavePix()">Copiar Chave Pix ✨</button>
      <button class="btn-fechar" type="button" onclick="fecharModalPix()">Fechar</button>
    </div>
  </div>

</div>

<audio id="musica" src="https://i.imgur.com/Qv9rKqF.mp4" loop preload="auto"></audio>

<script>
const CHAVE_PIX = "SUACHAVEPIXAQUI";

const stage = document.getElementById('stage');
const videoAbertura = document.getElementById('video-abertura');
const videoFala = document.getElementById('video-fala');
const btnPular = document.getElementById('btn-pular');
const convitePage = document.getElementById('convite-page');
const presentesPage = document.getElementById('presentes-page');
const btnLayerPrincipal = document.getElementById('btnLayerPrincipal');
const btnLayerPresentes = document.getElementById('btnLayerPresentes');
const musica = document.getElementById('musica');
const modalPix = document.getElementById('modal-pix');
const smokeOverlay = document.getElementById('smoke-overlay');
const butterfly = document.getElementById('butterfly');

document.getElementById('texto-chave-pix').innerText = CHAVE_PIX;

const canvas = document.getElementById('sparkle-canvas');
const ctx = canvas.getContext('2d');
let particles = [];
let butterflySparkles = [];

function ajustarCanvas() {
  canvas.width = stage.clientWidth;
  canvas.height = stage.clientHeight;
}
window.addEventListener('resize', ajustarCanvas);
ajustarCanvas();

// ==========================================
// 🦋 ANIMAÇÃO DA BORBOLETA E PÓ DE FADA
// ==========================================
let borboletaAtiva = false;
let bX = 100, bY = 200;
let prevX = 100, prevY = 200;
let tempoVoo = 0;

function ativarBorboleta(sim) {
  borboletaAtiva = sim;
  if (sim) {
    butterfly.style.display = 'block';
  } else {
    butterfly.style.display = 'none';
  }
}

// Inicia na Capa
ativarBorboleta(true);

function atualizarBorboleta() {
  if (!borboletaAtiva) return;

  tempoVoo += 0.025;
  const w = stage.clientWidth || 360;
  const h = stage.clientHeight || 640;

  prevX = bX;
  prevY = bY;

  bX = (w * 0.5) + Math.sin(tempoVoo * 0.9) * (w * 0.35) + Math.cos(tempoVoo * 1.8) * 25;
  bY = (h * 0.38) + Math.cos(tempoVoo * 0.7) * (h * 0.22) + Math.sin(tempoVoo * 1.5) * 35;

  const dx = bX - prevX;
  const dy = bY - prevY;
  const angulo = Math.atan2(dy, dx) * (180 / Math.PI) + 90;

  butterfly.style.transform = `translate(${bX - 24}px, ${bY - 24}px) rotate(${angulo}deg)`;

  if (Math.random() < 0.65) {
    const cores = ['#ffe29f', '#ffffff', '#ffd700', '#ffb6c1'];
    butterflySparkles.push({
      x: bX + (Math.random() * 8 - 4),
      y: bY + (Math.random() * 8 - 4),
      vx: (Math.random() - 0.5) * 1.2,
      vy: Math.random() * 1.5 + 0.4,
      radius: Math.random() * 2.8 + 1.2,
      alpha: 1,
      decay: Math.random() * 0.02 + 0.015,
      color: cores[Math.floor(Math.random() * cores.length)]
    });
  }
}

function loopAnimacao() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  atualizarBorboleta();

  for (let i = butterflySparkles.length - 1; i >= 0; i--) {
    const p = butterflySparkles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.alpha -= p.decay;

    if (p.alpha > 0) {
      ctx.save();
      ctx.globalAlpha = p.alpha;
      ctx.fillStyle = p.color;
      ctx.shadowBlur = 6;
      ctx.shadowColor = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    } else {
      butterflySparkles.splice(i, 1);
    }
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.alpha -= p.decay;

    if (p.alpha > 0) {
      ctx.save();
      ctx.globalAlpha = p.alpha;
      ctx.fillStyle = p.color;
      ctx.shadowBlur = 8;
      ctx.shadowColor = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    } else {
      particles.splice(i, 1);
    }
  }

  requestAnimationFrame(loopAnimacao);
}
requestAnimationFrame(loopAnimacao);

function animarBrilho(e) {
  ajustarCanvas();
  const rect = stage.getBoundingClientRect();
  const x = (e.clientX || (e.touches && e.touches[0].clientX) || (rect.left + rect.width / 2)) - rect.left;
  const y = (e.clientY || (e.touches && e.touches[0].clientY) || (rect.top + rect.height * 0.8)) - rect.top;

  const total = 35;
  const cores = ['#ffd700', '#fff8dc', '#ffb6c1', '#ffffff', '#e8a5b8'];

  for (let i = 0; i < total; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 5 + 1.5;
    particles.push({
      x: x, y: y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      radius: Math.random() * 3.5 + 1.5,
      alpha: 1,
      decay: Math.random() * 0.03 + 0.015,
      color: cores[Math.floor(Math.random() * cores.length)]
    });
  }
}

let jaIniciou = false;
let transicaoIniciada = false;

function iniciarExperiencia() {
  if (jaIniciou) return;
  jaIniciou = true;

  ativarBorboleta(false);

  stage.classList.add('opened');
  videoAbertura.classList.add('visivel');
  btnPular.style.display = 'block';

  videoAbertura.currentTime = 0;
  videoAbertura.play().catch(() => {
    videoAbertura.muted = true;
    videoAbertura.play().catch(transicaoParaFala);
  });

  videoAbertura.addEventListener('timeupdate', () => {
    if (!transicaoIniciada && videoAbertura.duration && (videoAbertura.duration - videoAbertura.currentTime <= 0.65)) {
      transicaoIniciada = true;
      transicaoParaFala();
    }
  });

  videoAbertura.onended = () => {
    if (!transicaoIniciada) transicaoParaFala();
  };
  videoAbertura.onerror = transicaoParaFala;
}

function transicaoParaFala() {
  transicaoIniciada = true;

  videoFala.currentTime = 0;
  videoFala.muted = false;
  videoFala.classList.add('visivel');

  if (musica) {
    musica.volume = 0.35;
    musica.play().catch(() => {});
  }

  videoFala.play().catch(() => {
    videoFala.muted = true;
    videoFala.play().catch(irParaFinal);
  });

  setTimeout(() => {
    videoAbertura.classList.remove('visivel');
    setTimeout(() => {
      videoAbertura.pause();
    }, 600);
  }, 300);

  videoFala.onended = irParaFinal;
  videoFala.onerror = irParaFinal;
}

function irParaFinal() {
  btnPular.style.display = 'none';

  smokeOverlay.classList.add('animar');

  setTimeout(() => {
    if (videoAbertura) {
      videoAbertura.classList.remove('visivel');
      videoAbertura.pause();
    }
    if (videoFala) {
      videoFala.classList.remove('visivel');
      videoFala.pause();
    }

    stage.classList.add('opened');

    if (musica) {
      musica.volume = 0.65;
      if (musica.paused) musica.play().catch(() => {});
    }

    convitePage.classList.add('show');
    btnLayerPrincipal.classList.add('show');

    setTimeout(() => {
      smokeOverlay.classList.remove('animar');
    }, 450);

  }, 350);
}

function abrirPaginaPresentes() {
  convitePage.classList.remove('show');
  btnLayerPrincipal.classList.remove('show');

  presentesPage.classList.add('show');
  btnLayerPresentes.classList.add('show');

  ativarBorboleta(true);
}

function voltarAoConvite() {
  presentesPage.classList.remove('show');
  btnLayerPresentes.classList.remove('show');

  ativarBorboleta(false);

  convitePage.classList.add('show');
  btnLayerPrincipal.classList.add('show');
}

function abrirModalPix() {
  modalPix.style.display = 'flex';
}

function fecharModalPix(e) {
  modalPix.style.display = 'none';
}

function copiarChavePix() {
  if (CHAVE_PIX === "SUACHAVEPIXAQUI") {
    alert("✨ Por favor, substitua 'SUACHAVEPIXAQUI' no início do script pelo seu Pix real!");
    return;
  }
  navigator.clipboard.writeText(CHAVE_PIX).then(() => {
    alert("✨ Chave Pix copiada com sucesso!");
    fecharModalPix();
  }).catch(() => {
    prompt("Copie a chave Pix abaixo:", CHAVE_PIX);
  });
}
</script>

</body>
</html>
