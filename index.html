<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Convite Especial - Aylla Vitória</title>

<meta property="og:type" content="website" />
<meta property="og:title" content="Convite Especial - Aylla Vitória" />
<meta property="og:description" content="Você é nosso convidado especial! Toque para abrir." />
<meta property="og:image" content="capa.png" />

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%;
  background: #0d0608;
  overflow: hidden;
  font-family: system-ui, -apple-system, sans-serif;
  display: flex; align-items: center; justify-content: center;
}

.stage {
  position: relative;
  width: 100%; height: 100%;
  max-width: 480px; max-height: 100vh;
  aspect-ratio: 9 / 16;
  background: #000;
  overflow: hidden;
  box-shadow: 0 0 35px rgba(0,0,0,0.85);
}

.stage img, .stage video {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  object-fit: cover;
}

/* 1. Capa Envelope */
#cover {
  z-index: 50;
  cursor: pointer;
}
.opened #cover {
  display: none !important;
}

/* 2. Vídeo de Abertura */
#intro-video {
  z-index: 40;
  display: none;
  background: #000;
}

/* Botão Pular Vídeo */
#btn-pular {
  position: absolute;
  right: 14px;
  bottom: 24px;
  z-index: 45;
  display: none;
  background: rgba(0, 0, 0, 0.7);
  color: #fff;
  border: 1px solid rgba(212, 175, 55, 0.8);
  border-radius: 20px;
  padding: 8px 16px;
  font-size: 13px;
  font-weight: bold;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

/* 3. Convite Principal */
#convite-page {
  z-index: 10;
  display: none;
}
#convite-page.show {
  display: block;
}

/* Indicador de toque na capa */
.tap-hint {
  position: absolute;
  top: 59%; left: 50%;
  transform: translate(-50%, -50%);
  z-index: 60;
  color: #fff;
  background: rgba(138, 30, 50, 0.92);
  border: 1px solid #d4af37;
  padding: 11px 24px;
  border-radius: 25px;
  font-size: 13px; font-weight: bold;
  letter-spacing: 1px;
  text-transform: uppercase;
  pointer-events: none;
  animation: pulse 1.8s infinite;
  box-shadow: 0 4px 18px rgba(0,0,0,0.5);
}
.opened .tap-hint { display: none !important; }

@keyframes pulse {
  0%, 100% { transform: translate(-50%, -50%) scale(1); }
  50% { transform: translate(-50%, -50%) scale(1.06); }
}

/* Botões invisíveis sobre a arte final */
.btn-layer {
  position: absolute; inset: 0;
  z-index: 35;
  display: none;
}
.btn-layer.show { display: block; }

.btn-click {
  position: absolute;
  border-radius: 50%;
  display: block;
  background: transparent;
  -webkit-tap-highlight-color: transparent;
}

#btn-local { left: 9%; top: 73.5%; width: 25%; height: 15%; }
#btn-presente { left: 37.5%; top: 73.5%; width: 25%; height: 15%; }
#btn-presenca { left: 65.5%; top: 73.5%; width: 25%; height: 15%; }

/* Onda de brilho imediata */
.btn-click:active::after {
  content: '';
  position: absolute;
  inset: -10%;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 223, 100, 0.8) 0%, rgba(212, 175, 55, 0.4) 50%, rgba(255, 255, 255, 0) 70%);
  animation: flashClick 0.5s ease-out;
}

@keyframes flashClick {
  0% { transform: scale(0.6); opacity: 1; }
  100% { transform: scale(1.4); opacity: 0; }
}

/* Canvas das partículas mágicas ao clicar */
#sparkle-canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 38;
  pointer-events: none;
}

/* Modal do Pix */
.modal-overlay {
  position: absolute; inset: 0;
  background: rgba(0,0,0,0.75);
  z-index: 100;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity 0.3s ease;
  padding: 20px;
}
.modal-overlay.active { opacity: 1; pointer-events: auto; }

.modal-box {
  background: #fffdf9;
  border: 2px solid #d4af37;
  border-radius: 20px;
  padding: 24px 20px;
  width: 90%; max-width: 320px;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,0.8);
}

.modal-title { color: #7b1828; margin: 0 0 10px; font-size: 20px; }
.modal-text { font-size: 14px; color: #555; margin-bottom: 16px; line-height: 1.4; }
.pix-input {
  width: 100%; padding: 10px; font-size: 13px; text-align: center;
  border: 1px dashed #d4af37; border-radius: 8px; background: #faf4ed;
  color: #333; margin-bottom: 12px; font-weight: 600;
}
.btn-copiar {
  background: #7b1828; color: #fff; border: none; padding: 12px;
  font-size: 14px; font-weight: bold; border-radius: 25px; cursor: pointer;
  width: 100%; margin-bottom: 10px;
}
.btn-fechar {
  background: transparent; color: #888; border: none; font-size: 13px;
  cursor: pointer; text-decoration: underline;
}
</style>
</head>
<body>

<div class="stage" id="stage">
  <!-- 1. Capa Envelope -->
  <img id="cover" src="capa.png" alt="Capa Envelope" onclick="iniciarExperiencia()">
  <div class="tap-hint" onclick="iniciarExperiencia()">Toque para abrir</div>

  <!-- 2. NOVO VÍDEO NO MEIO DAS 2 FOTOS -->
  <video id="intro-video" playsinline webkit-playsinline preload="auto" src="https://i.imgur.com/rWv7aXm.mp4"></video>
  <button id="btn-pular" type="button" onclick="irParaFinal()">Pular vídeo ✕</button>

  <!-- Canvas dos Brilhos Mágicos -->
  <canvas id="sparkle-canvas"></canvas>

  <!-- 3. Convite Principal -->
  <img id="convite-page" src="pagina.png" alt="Convite Principal">

  <!-- Botões Interativos com Brilhos -->
  <div class="btn-layer" id="btnLayer">
    <a id="btn-local" class="btn-click" 
       href="https://www.google.com/maps/search/?api=1&query=Espa%C3%A7o+Lion+Eventos" 
       target="_blank" rel="noopener" onclick="animarBrilho(event)"></a>

    <a id="btn-presente" class="btn-click" href="javascript:void(0)" 
       onclick="animarBrilho(event); abrirPresentes()"></a>

    <a id="btn-presenca" class="btn-click" 
       href="https://wa.me/55SEUNUMEROAQUI?text=Ol%C3%A1!%20Gostaria%20de%20confirmar%20minha%20presen%C3%A7a%20no%20anivers%C3%A1rio%20de%201%20aninho%20da%20Aylla%20Vit%C3%B3ria!%20%F0%9F%91%91" 
       target="_blank" rel="noopener" onclick="animarBrilho(event)"></a>
  </div>

  <!-- Modal do Pix -->
  <div class="modal-overlay" id="pixModal">
    <div class="modal-box">
      <h3 class="modal-title">Sugestão de Presente 🎁</h3>
      <p class="modal-text">Sua presença é o maior presente! Caso queira nos presentear de forma prática, você pode usar a chave Pix:</p>
      <input type="text" class="pix-input" id="chavePixVal" value="SUA_CHAVE_PIX_AQUI" readonly>
      <button class="btn-copiar" onclick="copiarPix()">Copiar Chave Pix</button>
      <button class="btn-fechar" onclick="fecharPresentes()">Voltar ao convite</button>
    </div>
  </div>
</div>

<!-- Música de Fundo (Loop) -->
<audio id="musica" src="https://i.imgur.com/Qv9rKqF.mp4" loop preload="auto"></audio>

<script>
const stage = document.getElementById('stage');
const video = document.getElementById('intro-video');
const btnPular = document.getElementById('btn-pular');
const convitePage = document.getElementById('convite-page');
const btnLayer = document.getElementById('btnLayer');
const musica = document.getElementById('musica');
const modal = document.getElementById('pixModal');

// Canvas para as partículas mágicas
const canvas = document.getElementById('sparkle-canvas');
const ctx = canvas.getContext('2d');
let particles = [];
let animId = null;

function ajustarCanvas() {
  canvas.width = stage.clientWidth;
  canvas.height = stage.clientHeight;
}
window.addEventListener('resize', ajustarCanvas);

function animarBrilho(e) {
  ajustarCanvas();
  const rect = stage.getBoundingClientRect();
  const x = (e.clientX || (e.touches && e.touches[0].clientX) || (rect.left + rect.width / 2)) - rect.left;
  const y = (e.clientY || (e.touches && e.touches[0].clientY) || (rect.top + rect.height * 0.8)) - rect.top;

  const total = 35;
  const cores = ['#ffd700', '#fff8dc', '#ffb6c1', '#ffffff', '#e8a5b8'];

  for (let i = 0; i < total; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 5 + 1.5;
    particles.push({
      x: x,
      y: y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      radius: Math.random() * 3.5 + 1.5,
      alpha: 1,
      decay: Math.random() * 0.03 + 0.015,
      color: cores[Math.floor(Math.random() * cores.length)]
    });
  }

  if (!animId) {
    animarParticulas();
  }
}

function animarParticulas() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  let vivas = false;

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.alpha -= p.decay;

    if (p.alpha > 0) {
      vivas = true;
      ctx.save();
      ctx.globalAlpha = p.alpha;
      ctx.fillStyle = p.cor;
      ctx.shadowBlur = 8;
      ctx.shadowColor = p.cor;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    } else {
      particles.splice(i, 1);
    }
  }

  if (vivas) {
    animId = requestAnimationFrame(animarParticulas);
  } else {
    animId = null;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
}

let jaIniciou = false;

function iniciarExperiencia() {
  if (jaIniciou) return;
  jaIniciou = true;

  video.style.display = 'block';
  btnPular.style.display = 'block';
  stage.classList.add('opened');

  video.currentTime = 0;
  const promessa = video.play();

  if (promessa !== undefined) {
    promessa.catch(() => {
      video.muted = true;
      video.play().catch(irParaFinal);
    });
  }

  video.onended = irParaFinal;
  video.onerror = irParaFinal;
}

function irParaFinal() {
  if (video) {
    video.pause();
    video.currentTime = 0;
    video.style.display = 'none';
  }
  btnPular.style.display = 'none';
  stage.classList.add('opened');

  // Ao chegar no convite final, toca a música de fundo em loop
  if (musica) {
    musica.volume = 0.65;
    musica.play().catch(() => {});
  }

  convitePage.classList.add('show');
  btnLayer.classList.add('show');
}

function abrirPresentes() {
  modal.classList.add('active');
}

function fecharPresentes() {
  modal.classList.remove('active');
}

function copiarPix() {
  const chave = document.getElementById('chavePixVal').value;
  navigator.clipboard.writeText(chave).then(() => {
    alert("✨ Chave Pix copiada com sucesso!");
  }).catch(() => {
    prompt("Copie a chave Pix abaixo:", chave);
  });
}
</script>

</body>
</html>
